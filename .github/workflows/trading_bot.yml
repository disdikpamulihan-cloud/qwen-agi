name: Singularity AGI Trading Bot Runner

on:
  workflow_dispatch: # Pemicu manual via tombol GitHub Actions
  schedule:
    # Contoh berjalan otomatis setiap jam (sesuai kebutuhan)
    - cron: '0 * * * *'

# Mencegah eksekusi ganda bersamaan (Anti-Spam)
concurrency:
  group: singularity-bot-execution
  cancel-in-progress: true

jobs:
  run-trading-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Create Logs Directory
        run: |
          mkdir -p logs

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Opsional: Membersihkan log atau state lama sebelum menjalankan bot
      - name: Clean Old State/Logs
        run: |
          rm -f state.json
          rm -f logs/*.log

      - name: Run Singularity Bot
        env:
          # Deklarasikan variabel rahasia API Key di menu Settings > Secrets GitHub
          LOG_LEVEL: "INFO"
          LOGS_DIR: "logs"
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python main.py
