name: Singularity Quantitative Trading Bot

on:
  workflow_dispatch: # Jalankan manual dari tab Actions
  schedule:
    # Berjalan otomatis setiap 6 jam (bisa disesuaikan)
    - cron: '0 */6 * * *'

# FITUR ANTI-SPAM: Mencegah eksekusi ganda jika workflow ditrigger ulang
concurrency:
  group: singularity-quant-execution
  cancel-in-progress: true

jobs:
  run-trading-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Create Logs Directory
        run: |
          mkdir -p logs

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Clean Old State & Logs
        run: |
          rm -f state.json
          rm -f logs/*.log
          echo "🧹 Environment cleaned!"

      - name: Run Quantitative Bot
        env:
          LOG_LEVEL: "INFO"
          LOGS_DIR: "logs"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python main.py
