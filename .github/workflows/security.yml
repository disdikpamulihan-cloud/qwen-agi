name: Security Scan

on:
  schedule:
    - cron: '0 0 * * 1'  # Setiap Senin 00:00 UTC
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4  # ← DIPERBAIKI: Kembali ke v4 (v7 tidak ada)
      with:
        fetch-depth: 0

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.36.0  # ← DIPERBAIKI: Tambahkan prefix 'v'
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Run Gitleaks (Secret Detection)
      uses: gitleaks/gitleaks-action@v2  # ← DIPERBAIKI: Pastikan ada prefix 'v'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true

    - name: Install Safety CLI
      run: pip install safety

    - name: Check Python dependencies for vulnerabilities
      run: safety check -r requirements.txt || true
